name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore locked dependencies
        run: dotnet restore LocalFileIntelligence.sln --locked-mode
      - name: Build
        run: dotnet build LocalFileIntelligence.sln --configuration Release --no-restore
      - name: Test code, SQL schema, and MCP contracts
        run: dotnet test LocalFileIntelligence.sln --configuration Release --no-build
      - name: Verify formatting
        run: dotnet format LocalFileIntelligence.sln --verify-no-changes --no-restore
      - name: Validate the empty example configuration
        run: dotnet run --project src\LocalFileIntelligence.WindowsService --configuration Release --no-build -- --validate-config config\indexing.example.json
