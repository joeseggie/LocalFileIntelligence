name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include commands, expected/actual behavior, and redacted error codes. Never attach a real index or personal files.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, .NET SDK, app version/commit, and affected LFI issue or phase.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and frequency
      description: Describe affected behavior without disclosing private data.
    validations:
      required: true
